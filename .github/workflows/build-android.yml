name: Build Android APK Diagnóstico

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências e CLI
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: Diagnóstico completo (não para se falhar)
        run: |
          echo "=== Raiz do projeto ==="
          ls -la
          echo "=== Pasta public ==="
          ls -la public || echo "❌ public não encontrado"
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json || echo "❌ config não encontrado"
          echo "=== package.json ==="
          cat package.json

      - name: Adicionar Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
